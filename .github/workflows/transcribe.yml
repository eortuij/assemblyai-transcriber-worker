name: Drive -> AssemblyAI -> callback
on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive file ID (must be public)"
        required: true
        type: string
      callback_url:
        description: "Optional: n8n webhook URL to POST results back to (leave blank if not used)"
        required: false
        type: string
      correlation_id:
        description: "Optional: ID you use to match the result back (Notion page ID etc.)"
        required: false
        type: string
      assemblyai_api_key:
        description: "AssemblyAI API Key (passed from n8n)"
        required: true
        type: string
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown

      - name: Download from Google Drive (public)
        env:
          DRIVE_FILE_ID: ${{ github.event.inputs.drive_file_id }}
        run: |
          gdown "$DRIVE_FILE_ID" -O input_media

      - name: Validate downloaded file
        run: |
          if [ ! -s input_media ]; then
            echo "ERROR: input_media is missing or empty"
            exit 1
          fi

          FILE_SIZE=$(stat --format=%s input_media)
          echo "Downloaded file size: $FILE_SIZE bytes"

          # Fail if file is an HTML page (Google Drive virus scan warning)
          if head -c 100 input_media | grep -qi '<!doctype\|<html'; then
            echo "ERROR: Downloaded file is an HTML page, not media."
            echo "The file may be too large for gdown to handle without confirmation."
            exit 1
          fi

          file input_media

      - name: Upload media to AssemblyAI
        env:
          ASSEMBLYAI_API_KEY: ${{ github.event.inputs.assemblyai_api_key }}
        run: |
          # Use -T to stream the file instead of --data-binary which loads
          # the entire file into memory (fails on large files like 1GB+ videos).
          # -X POST overrides -T's default PUT method.
          UPLOAD_RES=$(curl -sS -X POST "https://api.assemblyai.com/v2/upload" \
            -H "authorization: $ASSEMBLYAI_API_KEY" \
            -H "content-type: application/octet-stream" \
            -T input_media)

          echo "$UPLOAD_RES" | jq .

          UPLOAD_URL=$(echo "$UPLOAD_RES" | jq -r '.upload_url')

          if [ "$UPLOAD_URL" = "null" ] || [ -z "$UPLOAD_URL" ]; then
            echo "ERROR: Upload failed. Response:"
            echo "$UPLOAD_RES"
            exit 1
          fi

          echo "UPLOAD_URL=$UPLOAD_URL" >> $GITHUB_ENV

      - name: Submit transcript
        env:
          ASSEMBLYAI_API_KEY: ${{ github.event.inputs.assemblyai_api_key }}
        run: |
          SUBMIT_RES=$(curl -sS -X POST "https://api.assemblyai.com/v2/transcript" \
            -H "authorization: $ASSEMBLYAI_API_KEY" \
            -H "content-type: application/json" \
            -d "{\"audio_url\":\"$UPLOAD_URL\"}")

          echo "$SUBMIT_RES" | jq .

          TRANSCRIPT_ID=$(echo "$SUBMIT_RES" | jq -r '.id')

          if [ "$TRANSCRIPT_ID" = "null" ] || [ -z "$TRANSCRIPT_ID" ]; then
            echo "ERROR: Transcript submission failed. Response:"
            echo "$SUBMIT_RES"
            exit 1
          fi

          echo "TRANSCRIPT_ID=$TRANSCRIPT_ID" >> $GITHUB_ENV

      - name: Poll until completed
        env:
          ASSEMBLYAI_API_KEY: ${{ github.event.inputs.assemblyai_api_key }}
        run: |
          for i in {1..240}; do
            RES=$(curl -sS "https://api.assemblyai.com/v2/transcript/$TRANSCRIPT_ID" \
              -H "authorization: $ASSEMBLYAI_API_KEY")
            STATUS=$(echo "$RES" | jq -r '.status')
            echo "Poll $i — Status: $STATUS"
            if [ "$STATUS" = "completed" ]; then
              TEXT=$(echo "$RES" | jq -r '.text')
              echo "TRANSCRIPT_TEXT<<EOF" >> $GITHUB_ENV
              echo "$TEXT" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              exit 0
            fi
            if [ "$STATUS" = "error" ]; then
              echo "Transcription error:"
              echo "$RES" | jq .
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for transcript after 240 polls."
          exit 1

      - name: Optional callback (POST results)
        if: ${{ github.event.inputs.callback_url != '' }}
        env:
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          CORRELATION_ID: ${{ github.event.inputs.correlation_id }}
          DRIVE_FILE_ID: ${{ github.event.inputs.drive_file_id }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "content-type: application/json" \
            -d "$(jq -n \
              --arg correlation_id "$CORRELATION_ID" \
              --arg drive_file_id "$DRIVE_FILE_ID" \
              --arg transcript_id "${TRANSCRIPT_ID:-}" \
              --arg transcript_text "${TRANSCRIPT_TEXT:-}" \
              '{correlation_id:$correlation_id, drive_file_id:$drive_file_id, transcript_id:$transcript_id, transcript_text:$transcript_text}')"
